name: collect

on:
  schedule:
    # GitHub often starts scheduled runs 2-3 hours late, so there are several slots.
    # Each run collects; the first one that actually starts after 7 PM IST sends the email.
    - cron: "30 12 * * *"   # 18:00 IST
    - cron: "0 13 * * *"    # 18:30 IST
    - cron: "20 13 * * *"   # 18:50 IST
    - cron: "55 13 * * *"   # 19:25 IST
    - cron: "0 18 * * *"    # 23:30 IST - catch-up for late filers, no email
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --date 2026-10-23 --force-email"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["control/request.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Work out arguments
        id: args
        run: |
          case "${{ github.event_name }}" in
            schedule)
              if [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then echo "args=" >> "$GITHUB_OUTPUT";
              else echo "args=--email" >> "$GITHUB_OUTPUT"; fi ;;
            push)
              echo "args=$(python -c 'import json;print(json.load(open("control/request.json")).get("args",""))')" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "args=${{ github.event.inputs.args }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Collect
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python collector/run.py ${{ steps.args.outputs.args }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          git commit -qm "data $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X ours origin main && git push -q && break; sleep 5; done

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
