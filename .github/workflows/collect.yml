name: collect

on:
  schedule:
    # Two refreshes a day: 2 PM (partial, no email) and end of day (full, with the email).
    # Each run works out which one it is from the IST clock and skips if it was already done,
    # so the extra slots only matter when GitHub starts runs late (it often does, by hours).
    - cron: "30 8 * * *"    # 14:00 IST  - 2 PM refresh
    - cron: "15 13 * * *"   # 18:45 IST  - EOD refresh + email
    - cron: "30 14 * * *"   # 20:00 IST  - EOD fallback (skips if already done)
  workflow_dispatch:
    inputs:
      args:
        description: "Leave as is for a refresh now (before 6:30 PM = 2 PM-style partial refresh, after = end of day + email)"
        required: false
        default: "--auto --again"
  push:
    branches: [main]
    paths: ["control/request.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Work out arguments
        id: args
        run: |
          case "${{ github.event_name }}" in
            schedule)
              echo "args=--auto" >> "$GITHUB_OUTPUT" ;;
            push)
              echo "args=$(python -c 'import json;print(json.load(open("control/request.json")).get("args",""))')" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "args=${{ github.event.inputs.args }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Collect
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python collector/run.py ${{ steps.args.outputs.args }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          git commit -qm "data $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X ours origin main && git push -q && break; sleep 5; done

      - name: Stamp file versions
        if: always()
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
