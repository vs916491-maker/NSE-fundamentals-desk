name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub recommends: since 24 Nov 2026 deploy-pages often cannot see an artifact
  # uploaded a moment earlier in the same job ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp file versions so browsers load the new code after each update
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
